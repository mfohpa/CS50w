<!DOCTYPE html>
<html>
  <head>
    <title>Table</title>
    <style>
      table, td, th {
        border: 2px solid black;
        border-collapse: collapse;
        padding: 3px;
      }

    </style>
  </head>
  <body>
    <table>
      <thead>
        <tr>
          <th>People</th>
          <th>Age</th>
          <th>Location</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Sultan</td>
          <td>22</td>
          <td>Birmingham</td>
        </tr>
        <tr>
          <td>Aleks</td>
          <td>24</td>
          <td>London</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
