<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Style</title>
    <style>
      #foo {
        color: green;
      }
      .bar {
        font-size:20px
      }
      h1 {
        font-family:'Times New Roman', Times, serif
      }

    </style>
  </head>
  <body>
    <h1 id="foo">Welcome!</h1>
    <h1 class="bar">This is my page</h1>
    <h1 class="bar">Another header</h1>
    Hi how are you?
  </body>
</html>
